<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>딩동댕 연산나라</title>
<style>
/* 귀여운 손글씨 느낌의 웹폰트 적용 */
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');

body {
  margin: 0;
  font-family: 'Gaegu', 'Segoe UI', sans-serif;
  background-color: #f7ede2; /* 따뜻한 아이보리 배경 */
  background-image: radial-gradient(#f6bd60 1px, transparent 1px);
  background-size: 20px 20px; /* 땡땡이 패턴 */
  color: #333;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-weight: 700;
}

.game {
  width: 360px;
  padding: 25px;
  border-radius: 30px;
  background: #f1f5f2; /* 부드러운 스케치북 색상 */
  /* 크레파스로 삐뚤하게 그린 듯한 테두리 효과 */
  border: 6px dashed #f28482;
  box-shadow: 0 8px 0 #b7b7a4;
  position: relative;
}

.top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
  font-size: 24px;
}

.timer {
  color: #f28482;
}

.score {
  color: #84a59d;
}

/* 초록색 칠판 느낌의 문제창 */
.question {
  text-align: center;
  font-size: 46px;
  margin: 20px 0;
  padding: 20px 10px;
  background: #40916c;
  color: white;
  border-radius: 20px;
  border: 4px solid #2d6a4f;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
  min-height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
  letter-spacing: 2px;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

/* 크레파스로 칠한 듯한 알록달록 버튼들 */
button {
  font-family: 'Gaegu', sans-serif;
  padding: 15px;
  font-size: 26px;
  font-weight: 700;
  border: 3px solid #333;
  border-radius: 18px;
  cursor: pointer;
  transition: transform 0.1s;
  box-shadow: 0 5px 0 #333;
}

/* 알록달록한 보기를 위해 랜덤 느낌으로 배치될 색상들 */
.choices button:nth-child(1) { background: #f6bd60; }
.choices button:nth-child(2) { background: #f7adef; }
.choices button:nth-child(3) { background: #84a59d; }
.choices button:nth-child(4) { background: #f28482; }

button:hover:not(:disabled) {
  transform: translateY(-2px);
}

button:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #333;
}

button:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

/* 정답/오답 효과 */
.correct {
  background: #52b788 !important;
  color: white !important;
  animation: bounce 0.3s ease;
}

.wrong {
  background: #e63946 !important;
  color: white !important;
  animation: shake 0.3s ease;
}

.bottom {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.combo {
  color: #f28482;
  font-size: 22px;
}

#feedback {
  font-size: 22px;
  color: #e63946;
  text-align: center;
  min-height: 30px;
}

.start-screen, .end-screen {
  text-align: center;
}

.start-screen h1 {
  font-size: 42px;
  margin-top: 10px;
  color: #f28482;
  text-shadow: 2px 2px 0 #f6bd60;
}

.difficulty-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 25px 0;
}

.diff-btn {
  padding: 10px;
  font-size: 22px;
  background: #fff;
  border: 3px dashed #bbb;
  box-shadow: none;
}

.diff-btn.selected {
  border: 3px solid #f28482;
  background: #ffe5ec;
  box-shadow: 0 4px 0 #f28482;
  transform: scale(1.05);
}

.hidden {
  display: none;
}

/* 큼직한 커스텀 시작/다시하기 버튼 */
.big-btn {
  font-family: 'Gaegu', sans-serif;
  padding: 12px 25px;
  font-size: 26px;
  border-radius: 20px;
  background: #f6bd60;
  color: #333;
  border: 3px solid #333;
  box-shadow: 0 6px 0 #333;
  cursor: pointer;
  width: 100%;
}

/* 애니메이션 효과들 */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
</style>
</head>
<body>

<div class="game">

  <!-- 시작 화면 -->
  <div class="start-screen" id="startScreen">
    <h1>🖍️ 연산 스케치북</h1>
    <p style="font-size: 20px; margin: 0;">빠르게 계산해서 병아리를 키워봐요!</p>
    
    <div class="difficulty-options">
      <button class="diff-btn selected" onclick="selectDifficulty('easy', this)">🐥 병아리반 (한자리)</button>
      <button class="diff-btn" onclick="selectDifficulty('normal', this)">🦊 여우반 (두자리)</button>
      <button class="diff-btn" onclick="selectDifficulty('hard', this)">🐯 호랑이반 (세자리)</button>
    </div>

    <button class="big-btn" onclick="startGame()">출발~! 🚀</button>
  </div>

  <!-- 게임 화면 -->
  <div class="play-screen hidden" id="playScreen">
    <div class="top">
      <div class="timer">⏱️ <span id="time">60</span>초</div>
      <div class="score">⭐ <span id="score">0</span>점</div>
    </div>

    <div class="question" id="question">1 + 1</div>

    <div class="choices" id="choices"></div>

    <div class="bottom">
      <div class="status-bar">
        <div class="combo">🔥 불타는 <span id="combo">0</span>콤보</div>
      </div>
      <div id="feedback"></div>
    </div>
  </div>

  <!-- 종료 화면 -->
  <div class="end-screen hidden" id="endScreen">
    <h2 style="font-size: 36px; color: #f28482;">🎉 참 잘했어요!</h2>
    <p style="font-size: 26px;">내 점수: <span id="finalScore" style="color:#40916c;">0</span>점</p>
    <p id="evaluation" style="color: #f6bd60; font-size: 22px; margin: 15px 0;"></p>
    <button class="big-btn" onclick="location.reload()">한 번 더 하기 🔄</button>
  </div>

</div>

<script>
let score = 0;
let time = 60;
let combo = 0;
let correctAnswer;
let timer;
let difficulty = 'easy';
let isProcessing = false;

// 유치원생 버전 짜증나는/킹받는 멘트
const savageRemarks = [
  "메롱~ 틀렸대요~ 😜",
  "이것도 몰라? 빠라바라밤~ 🤔",
  "우우우~ 다시 풀어봐라~! 👎",
  "혹시 눈 감고 누른 거야? 🙈",
  "아이고야~ 내 이마야! 🤦",
  "천재인 줄 알았는데 아니었네! 쩝",
  "삐빅- 바보 탐지기 발동! 🚨",
  "에베베베~ 틀렸지요~ 👅",
  "계산기 빌려줄까? 응? 📱",
  "힝 속았지? 그게 아니지롱! 🤣"
];

function selectDifficulty(diff, element) {
  difficulty = diff;
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('selected'));
  element.classList.add('selected');
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('playScreen').classList.remove('hidden');
  nextQuestion();
  timer = setInterval(() => {
    time--;
    document.getElementById('time').textContent = time;
    if (time <= 0) endGame();
  }, 1000);
}

function getRandomNumber(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function nextQuestion() {
  isProcessing = false;
  let a, b, op;
  let ops = ['+', '-', '*'];

  if (difficulty === 'easy') {
    a = getRandomNumber(1, 9);
    b = getRandomNumber(1, 9);
    op = ops[Math.floor(Math.random() * 2)];
  } else if (difficulty === 'normal') {
    op = ops[Math.floor(Math.random() * ops.length)];
    if (op === '*') {
      a = getRandomNumber(2, 9);
      b = getRandomNumber(2, 19);
    } else {
      a = getRandomNumber(10, 89);
      b = getRandomNumber(10, 89);
    }
  } else if (difficulty === 'hard') {
    op = ops[Math.floor(Math.random() * ops.length)];
    if (op === '*') {
      a = getRandomNumber(11, 29);
      b = getRandomNumber(11, 29);
    } else {
      a = getRandomNumber(100, 999);
      b = getRandomNumber(100, 999);
    }
  }

  if (op === '+') correctAnswer = a + b;
  if (op === '-') correctAnswer = a - b;
  if (op === '*') correctAnswer = a * b;

  document.getElementById('question').textContent = `${a} ${op} ${b}`;

  let answers = [correctAnswer];
  let spread = difficulty === 'hard' ? 25 : 10;
  
  while (answers.length < 4) {
    let wrong = correctAnswer + getRandomNumber(-spread, spread);
    if (!answers.includes(wrong)) {
      answers.push(wrong);
    }
  }

  answers.sort(() => Math.random() - 0.5);

  let choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = '';

  answers.forEach(ans => {
    let btn = document.createElement('button');
    btn.textContent = ans;
    btn.onclick = () => checkAnswer(btn, ans);
    choicesDiv.appendChild(btn);
  });
}

function checkAnswer(button, answer) {
  if (isProcessing) return;
  isProcessing = true;

  let feedback = document.getElementById('feedback');
  let baseScore = difficulty === 'easy' ? 10 : (difficulty === 'normal' ? 20 : 40);
  const buttons = document.querySelectorAll('#choices button');
  buttons.forEach(btn => btn.disabled = true);

  if (answer === correctAnswer) {
    score += baseScore + combo * 5;
    combo++;
    button.classList.add('correct');
    feedback.style.color = '#52b788';
    feedback.textContent = '딩동댕! ⭕';
  } else {
    combo = 0;
    button.classList.add('wrong');
    feedback.style.color = '#e63946';
    
    const randomComment = savageRemarks[Math.floor(Math.random() * savageRemarks.length)];
    feedback.textContent = randomComment;

    buttons.forEach(btn => {
      if (parseInt(btn.textContent) === correctAnswer) {
        btn.classList.add('correct');
      }
    });
  }

  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = combo;

  setTimeout(() => {
    nextQuestion();
    feedback.textContent = '';
  }, 500); // 멘트를 더 잘 볼 수 있게 대기시간을 살짝 늘렸어요!
}

function endGame() {
  clearInterval(timer);
  document.getElementById('playScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  document.getElementById('finalScore').textContent = score;

  let evalText = "";
  if (score === 0) evalText = "더 열심히 공부해야겠어요! 😭";
  else if (score < 100) evalText = "조금만 더 힘내봐요! 화이팅! 👍";
  else if (score < 300) evalText = "와우! 칭찬 스티커 1개 드립니다! 💮";
  else if (score < 600) evalText = "당신은 혹시 우리 동네 천재 어린이?! 👑";
  else evalText = "선생님 대리출석 하셨나요? 엄청나요! 🌟";
  
  document.getElementById('evaluation').textContent = evalText;
}
</script>

</body>
</html>
